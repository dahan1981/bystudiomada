name: Portal Mada CI

on:
  pull_request:
    paths:
      - "portal-mada/**"
      - "api/portal-*.js"
      - "lib/portal-*.js"
      - "lib/supabase-server.js"
      - "supabase/**"
      - "tests/**"
      - "package*.json"
  push:
    branches: [main, codex/portal-mada-production-hardening]
    paths:
      - "portal-mada/**"
      - "api/portal-*.js"
      - "lib/portal-*.js"
      - "lib/supabase-server.js"
      - "supabase/**"
      - "tests/**"
      - "package*.json"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:secrets
      - run: npm run ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
